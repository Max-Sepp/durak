[project]
name = "durak"
version = "0.1.0"
description = "Durak card game engine and FastAPI server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Neural-network AI (durak_ai.nn). Install with `uv sync --extra nn`.
nn = [
    "torch>=2.13",
    "numpy>=2",
]

[tool.uv.sources]
# CUDA 13.2 builds of PyTorch; the default PyPI wheel doesn't target this GPU stack.
torch = [{ index = "pytorch-cu132", extra = "nn" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durak_engine", "src/durak_server", "src/durak_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
