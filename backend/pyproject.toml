[project]
name = "durak"
version = "0.1.0"
description = "Durak card game engine and FastAPI server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durak_engine", "src/durak_server", "src/durak_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
